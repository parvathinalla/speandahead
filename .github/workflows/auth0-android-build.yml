name: Auth0 Android debug build

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "lib/auth/**"
      - "pubspec.yaml"
      - ".github/workflows/auth0-android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - "lib/auth/**"
      - "pubspec.yaml"

jobs:
  android-debug-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH0_DOMAIN: ci-tenant.us.auth0.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile Android debug with mock PUBLIC Auth0 identifiers
        run: >-
          flutter build apk --debug
          --dart-define=AUTH0_DOMAIN=ci-tenant.us.auth0.com
          --dart-define=AUTH0_NATIVE_CLIENT_ID=public-client-id-for-ci
          --dart-define=AUTH0_AUDIENCE=https://api.creditpilot.test
          --dart-define=API_BASE_URL=https://api.creditpilot.example
